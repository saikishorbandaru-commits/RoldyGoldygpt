<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1c1917" />
      <stop offset="100%" stopColor="#0c0a09" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="35%" stopColor="#f59e0b" />
      <stop offset="70%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#d97706" stroke-width="8" />
  <!-- Crown & Diamond Luxury Logo Motif -->
  <g transform="translate(256, 256)">
    <!-- Outer Octagonal Facet Ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
    <!-- Crown Diadem -->
    <path d="M -90,-20 L -120,-90 L -50,-60 L 0,-110 L 50,-60 L 120,-90 L 90,-20 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />
    <!-- Diamond Gem Base -->
    <polygon points="-100,0 100,0 0,120" fill="url(#goldGrad)" stroke="#78350f" stroke-width="4" />
    <line x1="-100" y1="0" x2="0" y2="120" stroke="#fef08a" stroke-width="3" opacity="0.9" />
    <line x1="100" y1="0" x2="0" y2="120" stroke="#78350f" stroke-width="3" opacity="0.7" />
    <line x1="-50" y1="0" x2="0" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <line x1="50" y1="0" x2="0" y2="120" stroke="#ffffff" stroke-width="2" opacity="0.6" />
    <!-- Center Letter R -->
    <text x="0" y="-28" font-family="'Cormorant Garamond', serif" font-size="44" font-weight="700" fill="#0c0a09" text-anchor="middle">👑</text>
  </g>
</svg>
